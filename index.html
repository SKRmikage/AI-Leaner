<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPlanner · 學習規劃助手</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🎓</span>
      <div>
        <h1>StudyPlanner</h1>
        <p class="tagline">AI 導師 · 學習規劃 · 日程表</p>
      </div>
    </div>
    <nav class="tabs" aria-label="主要頁籤">
      <button class="tab active" data-view="chat">💬 與導師對話</button>
      <button class="tab" data-view="plan">📅 學習規劃</button>
      <button class="tab" data-view="materials">📚 學習材料</button>
      <button class="tab" data-view="settings">⚙️ 設定</button>
    </nav>
  </header>

  <main>
    <!-- ============ 對話 ============ -->
    <section id="view-chat" class="view active">
      <div class="chat-scroll">
        <div id="chat-list" class="chat-list"></div>
      </div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <div class="chat-input-row">
          <textarea id="chat-input" rows="2" placeholder="問 AI 導師：我想學遊戲渲染，打算三個月內完成，每天能花 3 小時…"></textarea>
          <button type="submit" class="btn btn-primary" id="chat-send">傳送</button>
        </div>
        <div class="chat-form-hint">
          <button type="button" class="link-btn" id="btn-example">✨ 載入範例：遊戲渲染</button>
          <span class="hint-text">導師可輸出「建議規劃」；你確認後即可採納並寫入規劃。</span>
        </div>
      </form>
    </section>

    <!-- ============ 規劃 ============ -->
    <section id="view-plan" class="view">
      <div class="view-head">
        <h2>📅 學習規劃</h2>
        <div class="head-actions">
          <button class="btn" id="btn-edit-overview">編輯總覽</button>
          <button class="btn" id="btn-export-json">匯出 JSON</button>
          <button class="btn" id="btn-import-json">匯入 JSON</button>
        </div>
      </div>
      <div id="plan-overview" class="card"></div>
      <div class="view-head sub">
        <h3>🗺️ 階段與每週任務</h3>
        <button class="btn" id="btn-add-phase">＋ 新增階段</button>
      </div>
      <div id="plan-phases" class="phase-list"></div>
      <div class="view-head sub">
        <h3>🗓️ 日程表</h3>
      </div>
      <div id="plan-schedule" class="card"></div>
      <input type="file" id="import-file" accept="application/json" hidden />
    </section>

    <!-- ============ 材料 ============ -->
    <section id="view-materials" class="view">
      <div class="view-head">
        <h2>📚 學習材料</h2>
        <button class="btn" id="btn-add-material">＋ 新增材料</button>
      </div>
      <div id="materials-list" class="material-list"></div>
    </section>

    <!-- ============ 設定 ============ -->
    <section id="view-settings" class="view">
      <div class="view-head"><h2>⚙️ 設定</h2></div>
      <form id="settings-form" class="card form-card" autocomplete="off">
        <h3>AI 導師連線（OpenAI 相容 API）</h3>
        <p class="form-note">設定後關閉「示範模式」，AI 導師將透過你提供的 API 產生真正的學習建議。API Key 只存放在瀏覽器 localStorage，不會上傳到其他地方。</p>
        <label>API 位址 (Base URL)
          <input type="text" id="set-base-url" placeholder="https://api.openai.com/v1" />
        </label>
        <label>模型
          <input type="text" id="set-model" placeholder="gpt-4o-mini" />
        </label>
        <label>API Key
          <input type="password" id="set-api-key" placeholder="sk-..." />
        </label>
        <label class="check-row">
          <input type="checkbox" id="set-demo-mode" checked />
          示範模式（不使用 API，內建規則式導師，離線可用）
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">儲存設定</button>
          <button type="button" class="btn" id="btn-test-api">測試連線</button>
        </div>
        <div id="settings-status" class="status-line"></div>
      </form>

      <div class="card danger-zone">
        <h3>⚠️ 資料管理</h3>
        <p>所有規劃、對話與設定都儲存在此瀏覽器的 localStorage。你可以匯出 JSON 備份，或清除全部資料。</p>
        <button class="btn btn-danger" id="btn-reset-data">清除所有資料（恢復範例）</button>
      </div>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/store.js"></script>
  <script src="js/tutor.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
